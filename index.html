<!DOCTYPE html>

<head>
<meta charset="UTF-8">

<title>Мои закладки</title>
<style>
    * { box-sizing: border-box; }
    body {
        margin: 0;
        font-family: 'Segoe UI', Arial, sans-serif;
        background: #050505;
        color: #eaeaea;
        padding: 24px 16px 60px;
    }
    .wrap { max-width: 1180px; margin: 0 auto; }

    .topbar {
        background: #111;
        border: 1px solid #1c1c1c;
        border-radius: 16px;
        padding: 18px 24px;
        margin-bottom: 22px;
        text-align: center;
    }
    .topbar h1 { font-size: 22px; margin: 0; font-weight: 700; }

    .tabs { display: flex; gap: 14px; margin-bottom: 22px; flex-wrap: wrap; }
    .tab {
        flex: 1 1 0; min-width: 140px;
        background: #111;
        border: 1px solid #1c1c1c;
        border-radius: 12px;
        padding: 16px 10px;
        text-align: center;
        font-size: 17px;
        font-weight: 600;
        color: #ddd;
        cursor: pointer;
        transition: 0.25s ease;
        user-select: none;
    }
    .tab:hover {
        border-color: #5b21b6;
        color: #fff;
    }
    .tab.active {
        border-color: #a855f7;
        color: #fff;
    }

    .grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 14px;
    }
    @media (max-width: 720px) {
        .grid { grid-template-columns: 1fr; }
    }

    .card {
        background: #0d0d0d;
        border: 1px solid #1c1c1c;
        border-radius: 12px;
        padding: 18px 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        color: #eaeaea;
        text-decoration: none;
        transition: border-color 0.25s ease, box-shadow 0.25s ease;
    }
    .card:hover {
        border-color: #5b21b6;           /* тёмно-фиолетовый бордер */
        box-shadow: 0 0 0 1px #5b21b6 inset;
    }

    .card .name {
        font-size: 18px;
        font-weight: 700;
        color: #fff;
    }

    .section { display: none; }
    .section.active { display: grid; }

    @keyframes fadeUp {
        from { opacity: 0; transform: translateY(14px); }
        to   { opacity: 1; transform: translateY(0); }
    }
    .section.active .card {
        animation: fadeUp 0.35s ease both;
    }
    .section.active .card:nth-child(1)  { animation-delay: 0.00s; }
    .section.active .card:nth-child(2)  { animation-delay: 0.03s; }
    .section.active .card:nth-child(3)  { animation-delay: 0.06s; }
    .section.active .card:nth-child(4)  { animation-delay: 0.09s; }
    .section.active .card:nth-child(5)  { animation-delay: 0.12s; }
    .section.active .card:nth-child(6)  { animation-delay: 0.15s; }
    .section.active .card:nth-child(7)  { animation-delay: 0.18s; }
    .section.active .card:nth-child(8)  { animation-delay: 0.21s; }
    .section.active .card:nth-child(9)  { animation-delay: 0.24s; }
    .section.active .card:nth-child(10) { animation-delay: 0.27s; }
    .section.active .card:nth-child(11) { animation-delay: 0.30s; }
    .section.active .card:nth-child(12) { animation-delay: 0.33s; }
</style>
</head>

<script>
    const tabs = document.querySelectorAll('.tab');
    const sections = document.querySelectorAll('.section');
    tabs.forEach(tab => {
        tab.addEventListener('click', () => {
            tabs.forEach(t => t.classList.remove('active'));
            sections.forEach(s => s.classList.remove('active'));
            tab.classList.add('active');
            document.getElementById(tab.dataset.target).classList.add('active');
        });
    });
</script>
